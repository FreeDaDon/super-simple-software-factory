# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# Every agent runs through the `claude` CLI on your Claude subscription (coding_agent: claude_code).
defaults:
  coding_agent: claude_code
  # A Claude alias — fable | opus | sonnet | haiku — always resolves to the newest model of that
  # family. Pin an exact one with a full id such as claude-sonnet-5-5 when you need a repeatable run.
  model: sonnet
  effort: medium                   # low | medium | high | xhigh | max  (claude --effort)
  harness_engineering: []          # MCP config JSON paths, passed as --mcp-config (see harness_engineering/README.md)
  # Which Claude Code settings layers an agent loads. Empty = none: no personal hooks or plugins,
  # and no project hooks or permission rules from the run's worktree, which an earlier agent
  # could have edited. This repo's CLAUDE.md is still given to every agent, read from the run's
  # baseline commit. Comma-separated if you need them: user,project,local.
  setting_sources: ""
  # Roster-wide allowlist; any agent may override with its own list. These are Claude Code tool
  # names and they are case-sensitive. The agent runs with --permission-mode dontAsk, so a tool
  # that is not named here is DENIED, never prompted for.
  tools:
    - Read                         # read file contents
    - Grep                         # search file contents
    - Glob                         # find files by pattern (replaces ls / find)
    - Bash                         # execute shell commands
    - Edit                         # find/replace edits
    - Write                        # create/overwrite files
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: Bash runs `git checkout`, and Write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
    - adws/conftest.py
    - .claude/
    - .github/
    - .env
    - "**/.env"
    - .env.*
    - "**/.env.*"
  # The grader: tests and the config that decides how they run. A file matching these that
  # existed when the run started may be modified only if the plan listed it in `may_modify`
  # (declared before any code is written), and may never be deleted. New tests are always fine.
  grader_files:
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/tests/**"
    - "**/test/**"
    - "**/__tests__/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*_test.go"
    - "**/pyproject.toml"
    - "**/setup.cfg"
    - "**/pytest.ini"
    - "**/tox.ini"
    - "**/package.json"
    - "**/bunfig.toml"
    - "**/vitest.config.*"
    - "**/jest.config.*"
    - "**/justfile"
    - "**/Makefile"
    - "**/Cargo.toml"
    - "**/go.mod"
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/
  # Every run works in its own git worktree on branch sssf/<adw_id>, created here (relative to
  # the repo). Your checkout and its uncommitted work are never touched; an accepted run leaves
  # its branch for you to merge, and prints the commands.
  worktree_dir: ../.sssf-worktrees
  # bubblewrap box around every agent and every quality command (Linux; warns and runs without
  # it elsewhere). Read-only filesystem, empty $HOME except the entries below, private /tmp.
  # Only the run's worktree and session dir are writable. Network stays on.
  sandbox:
    enabled: true
    home_readonly: [.local, .bun, .cargo, .rustup, go, .nvm, .pyenv, .deno, .gitconfig]
    home_writable: [.claude, .claude.json, .cache, .npm]   # claude's login + session files
  # Limits. A claude process with no output for agent_idle_timeout_seconds, or running longer than
  # agent_max_seconds, is killed and its phase fails. max_run_cost_usd caps a whole run in
  # list-price-equivalent dollars (on a subscription it measures usage; nothing is charged): it is
  # passed to every call as --max-budget-usd and checked between calls.
  agent_idle_timeout_seconds: 900
  agent_max_seconds: 3600
  max_run_cost_usd: 25
  # When your subscription's usage window runs out mid-run, the run waits for the reset and
  # resumes the same agent session. A reset further away than this fails the run instead.
  rate_limit_max_wait_seconds: 21600

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Model choice is a subscription-limit decision as much as a quality one: Opus drains the five-hour
# window several times faster than Sonnet, Haiku barely registers. The starter roster spends Opus
# where judgement matters (planning, review) and Haiku where the work is mechanical. On a Pro
# plan, consider sonnet for the planner and reviewer: one Opus-heavy run can use most of a window.
agents:
  - name: planner
    model: opus
    effort: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no Edit — the planner never touches repo files
      - Read
      - Grep
      - Glob
      - Bash
      - Write
      - Agent                      # Claude Code subagents, for parallel recon

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - Read
      - Grep
      - Glob
      - Bash
      - Edit
      - Write

  - name: scout
    model: haiku
    effort: low
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; Write only so scout_findings.md lands without a bash heredoc
      - Read
      - Grep
      - Glob
      - Bash
      - Write
      - Agent                      # Claude Code subagents, one per lead or directory

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: opus
    effort: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; Write only for review.md, no Edit
      - Read
      - Grep
      - Glob
      - Bash
      - Write

  - name: documenter
    model: haiku
    effort: low
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - Read
      - Grep
      - Glob
      - Bash
      - Write
      - Edit
